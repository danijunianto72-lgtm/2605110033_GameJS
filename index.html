<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2D Platformer Project</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-scalable: none; }
        html, body {
            width: 100%;
            height: 100dvh; /* Otomatis menyesuaikan sisa layar bersih di bawah address bar HP */
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        canvas {
            aspect-ratio: 16 / 9;
            width: 100%;
            height: 100%;
            max-width: 177.78dvh;
            max-height: 56.25vw;
            object-fit: contain;
            display: block;
            touch-action: none;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="1920" height="1080"></canvas>
    <script src="js/hud.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
